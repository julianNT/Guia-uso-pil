<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222">
  <title>Partición del lazo de control del MPC entre la placa y el computador</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1120" height="440" fill="#fff"/>

  <!-- Particion -->
  <g fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="7 6">
    <rect x="215" y="60" width="400" height="300" rx="6"/>
    <rect x="750" y="100" width="230" height="200" rx="6"/>
  </g>
  <g font-size="18" fill="#555">
    <text x="227" y="86">Placa (mpc_ctrl)</text>
    <text x="762" y="126">Computador</text>
  </g>

  <!-- Bloques -->
  <g fill="#fff" stroke="#222" stroke-width="2.5">
    <rect x="300" y="110" width="220" height="210"/>
    <rect x="770" y="150" width="190" height="125"/>
  </g>
  <g text-anchor="middle">
    <text x="410" y="223">MPC + OSQP</text>
    <text x="865" y="220">Motor DC</text>
  </g>

  <!-- Senales -->
  <g fill="none" stroke="#222" stroke-width="2.5">
    <path d="M40,190 H298" marker-end="url(#flecha)"/>
    <path d="M40,235 H298" marker-end="url(#flecha)"/>
    <path d="M40,280 H298" marker-end="url(#flecha)"/>
    <path d="M520,185 H768" marker-end="url(#flecha)"/>
    <path d="M520,285 H680" marker-end="url(#flecha)"/>
    <path d="M960,212 H1090" marker-end="url(#flecha)"/>
    <!-- Realimentacion del estado -->
    <path d="M1040,212 V30 H160 V140 H298" marker-end="url(#flecha)"/>
    <!-- Torque de carga hacia la planta -->
    <path d="M120,280 V410 H710 V240 H768" marker-end="url(#flecha)"/>
  </g>
  <g fill="#222">
    <circle cx="120" cy="280" r="5"/>
    <circle cx="1040" cy="212" r="5"/>
  </g>

  <!-- Etiquetas -->
  <text x="48" y="178">ω*[k]</text>
  <text x="48" y="223">I<tspan font-size="16" dy="5">max</tspan></text>
  <text x="48" y="268">T<tspan font-size="16" dy="5">L</tspan><tspan dy="-5">[k]</tspan></text>
  <text x="630" y="170">V[k]</text>
  <text x="630" y="272">iter[k]</text>
  <text x="1052" y="197">x[k]</text>
  <text x="600" y="20" text-anchor="middle">x[k] = [ i[k]; ω[k] ]</text>
</svg>

site_name: Guías de simulación Processor-in-the-Loop en MATLAB/Simulink

theme:
  name: material
  language: es

nav:
  - Home: index.md
  - Guía 1: Guia_1_Instalacion/Guia_1.md
  - Guía 1.2: Guia_1.2_Configuracion/Guia_1_2.md
  - Guía 2.1: Guia_2.1_PID_AntiWindup/Guia_2_1.md

exclude_docs: |
  Guia_3_MPC/

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

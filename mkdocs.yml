site_name: Guías PIL en MATLAB/Simulink

theme:
  name: material
  language: es

nav:
  - Home: index.md
  - Guía 1: Guia_1_Instalacion/Guia_1.md
  - Guía 2: Guia_2_Configuracion/Guia_2.md
  - Guía 3: Guia_3_PID_AntiWindup/Guia_3.md
  - Guía 4: Guia_4_MPC/Guia_4.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
